name: Lint

on:
  push:
    branches:
      - 0.0.x
  pull_request:
    branches:
      - 0.0.x

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3

      - name: Check formatting
        # .usages/ holds read-only contract docs with embedded Python blocks that
        # ruff (>=0.16) would rewrite; excluded via CLI, the same scope the plan records.
        run: ruff format --check --exclude '.usages' goga_tool_autonomous/ tests/
