prompt: |
  Answer (feedbacks, proposes, questions:`*.question.json` and etc) in Russian language.
  Any content written to the project files is in English.

  Requirements:
  - For development use venv outside the project, in /opt/project

memory:
  max_rules: 15
  commit: true

stages:
  prototype-architecture:
    reflect:
      file: architecture.md
  architecture-review:
    approve: auto
  apply-architecture:
    approve: auto
  code-design:
    approve: auto
    reflect:
      file: code-design.md
      mode: r
  design-review:
    approve: auto
    reflect:
      file: code-design.md
  coding-plan:
    approve: auto
  plan-review:
    approve: auto
  accept-result:
    manual: false

extend:
  build:
    title: "Build implementation"
    after:
      - commit-changes
    timeout: "8h"
    script: python3 -P -m goga.build "$(python3 -m goga history path -f plan.md)"
    after_script: rm -rf .ralphex
